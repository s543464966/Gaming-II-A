function getLayout(key){
 const l=layouts[key];
 const cells=[];
 l.rows.forEach((row,r)=>{const start=(W-(row.length-1)*l.pitch-244*l.scale)/2+l.offsets[r];row.forEach((stack,c)=>cells.push({id:'r'+(r+1)+'c'+(c+1),row:r+1,order:c+1,x:start+c*l.pitch,y:l.ys[r],stack}));});
 return {...l,key,cells};
}

const geometry=[];

 });

}
