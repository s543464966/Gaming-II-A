<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆形订单盒与方盒对比</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f7f0e5;font-family:"Microsoft YaHei",sans-serif;color:#68432f}body{display:flex;justify-content:center}#viewport{position:relative;flex:none;overflow:hidden}main{position:absolute;left:0;top:0;width:1440px;height:2220px;transform-origin:top left;background:radial-gradient(ellipse at 95% 5%,#ffe5dc99,transparent 43%),#f7f0e5;overflow:hidden}img{position:absolute;display:block}.title,.subtitle,.heading,.label,.column{position:absolute;z-index:30}.title{font-size:48px;font-weight:800;letter-spacing:2px}.subtitle{font-size:25px;color:#a38068}.heading{font-size:28px;font-weight:700}.label{font-size:25px;font-weight:600;text-align:center;color:#8d674e}.column{font-size:27px;font-weight:700;text-align:center}.card{position:absolute;border:2px solid #ecdfd1;border-radius:26px;background:#fffaf2;box-shadow:0 4px 0 #ecdfce55}.stack{background:linear-gradient(#fffaf3,#f5e8d6)}</style></head><body><div id="viewport"><main></main></div><script>const assets={"square_pink":{"file":"../../Archive/ReferenceImage/planning/source_bundle/square_box_pink.png","label":"草莓粉 · 爱心","width":1254,"height":1254,"bounds":[78,263,1177,974],"transparent":50},"square_mint":{"file":"../../Archive/ReferenceImage/planning/source_bundle/square_box_mint.png","label":"薄荷绿 · 条纹","width":1254,"height":1254,"bounds":[97,276,1158,976],"transparent":52},"square_cream":{"file":"../../Archive/ReferenceImage/planning/source_bundle/square_box_cream.png","label":"奶油白 · 波点","width":1254,"height":1254,"bounds":[102,260,1153,1013],"transparent":49},"round_pink":{"file":"../../Archive/ReferenceImage/planning/source_bundle/round_box_pink.png","label":"草莓粉 · 爱心","width":1254,"height":1254,"bounds":[96,265,1157,1023],"transparent":57},"round_mint":{"file":"../../Archive/ReferenceImage/planning/source_bundle/round_box_mint.png","label":"薄荷绿 · 条纹","width":1254,"height":1254,"bounds":[98,263,1156,1023],"transparent":57},"round_cream":{"file":"../../Archive/ReferenceImage/planning/source_bundle/round_box_cream.png","label":"奶油白 · 波点","width":1254,"height":1254,"bounds":[97,264,1157,1025],"transparent":57},"pink":{"file":"../../Archive/ReferenceImage/planning/source_bundle/strawberry_donut.png","label":"草莓","width":1254,"height":1254,"bounds":[47,260,1209,1071],"transparent":53},"brown":{"file":"../../Archive/ReferenceImage/planning/source_bundle/chocolate_donut.png","label":"巧克力","width":1254,"height":1254,"bounds":[45,258,1213,1071],"transparent":53},"green":{"file":"../../Archive/ReferenceImage/planning/source_bundle/matcha_donut.png","label":"抹茶","width":1254,"height":1254,"bounds":[45,251,1218,1074],"transparent":53},"blue":{"file":"../../Archive/ReferenceImage/planning/source_bundle/blueberry_donut.png","label":"蓝莓","width":1254,"height":1254,"bounds":[42,254,1216,1075],"transparent":52},"yellow":{"file":"../../Archive/ReferenceImage/planning/source_bundle/orange_donut.png","label":"橙色","width":1254,"height":1254,"bounds":[48,258,1211,1072],"transparent":53},"purple":{"file":"../../Archive/ReferenceImage/planning/source_bundle/grape_donut.png","label":"葡萄","width":1254,"height":1254,"bounds":[43,254,1214,1071],"transparent":53}};
 function height(id,w){const b=assets[id].bounds;return w*(b[3]-b[1])/(b[2]-b[0]);}
 function sprite(id,x,y,w,extra=''){const a=assets[id],b=a.bounds,k=w/(b[2]-b[0]);return '<img src="'+a.file+'" style="left:'+(x-b[0]*k)+'px;top:'+(y-b[1]*k)+'px;width:'+(a.width*k)+'px;height:'+(a.height*k)+'px;'+extra+'">';}
 function text(t,x,y,w,c='label'){return '<div class="'+c+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px">'+t+'</div>';}
 let s=text('订单盒 · 圆形方案',72,44,1296,'title')+text('沿用俯视角与纸盒风格，比较空盒和四颗叠放效果',72,112,1296,'subtitle');
 s+=text('三款圆形纸盒',72,168,1296,'heading');
 ['round_pink','round_mint','round_cream'].forEach((id,i)=>{const x=72+i*444;s+='<div class="card" style="left:'+x+'px;top:210px;width:408px;height:302px"></div>';s+=sprite(id,x+50,234+(210-height(id,308))/2,308);s+=text(assets[id].label,x+10,464,388);});
 s+=text('同尺寸叠放对比',72,554,1296,'heading');s+=text('方形订单盒',72,602,624,'column')+text('圆形订单盒',744,602,624,'column');
 const palettes=['pink','mint','cream'],stacks=[['pink','pink','pink','pink'],['yellow','green','yellow','green'],['purple','blue','brown','pink']];
 palettes.forEach((color,row)=>{['square','round'].forEach((shape,col)=>{const x=72+col*672,y=650+row*504,id=shape+'_'+color,a=assets[id],bw=288,bh=height(id,bw),by=y+410-bh,bx=x+168;
 s+='<div class="card stack" style="left:'+x+'px;top:'+y+'px;width:624px;height:480px"></div>';
 s+=sprite(id,bx,by,bw,'z-index:2');const floor=by+bh*(shape==='round'?.75:.91);
 stacks[row].forEach((d,n)=>{const w=222,dh=height(d,w);s+=sprite(d,x+201,floor-dh-n*58,w,'z-index:'+(3+n));});
 if(shape==='round'){const pts=[[0,44.66]];for(let n=0;n<=64;n++){const t=Math.PI-n*Math.PI/64;pts.push([49.92+39.87*Math.cos(t),44.66+22.81*Math.sin(t)]);}pts.push([100,44.66],[100,100],[0,100]);s+=sprite(id,bx,by,bw,'z-index:10;clip-path:polygon('+pts.map(p=>p[0]+'% '+p[1]+'%').join(',')+')');}else{const front=(a.bounds[1]+(a.bounds[3]-a.bounds[1])*.82)/a.height*100;s+=sprite(id,bx,by,bw,'z-index:10;clip-path:inset('+front+'% 0 0 0)');}
 s+=text(a.label+' / '+['同色四颗','双色四颗','混色四颗'][row],x+16,y+430,592);
 });});
 document.querySelector('main').innerHTML=s;
 function fit(){const k=Math.min(innerWidth/1440,1);document.querySelector('#viewport').style.cssText='width:'+1440*k+'px;height:'+2220*k+'px';document.querySelector('main').style.transform='scale('+k+')';}addEventListener('resize',fit);fit();window.READY=Promise.all([...document.images].map(i=>i.decode()));
